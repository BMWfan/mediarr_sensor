name: Maintenance monitor (read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: '37 7 * * 1'
  push:
    branches: [feat/maintenance-monitor]
permissions:
  contents: read
  actions: read
concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Shared report-only monitor (reviewed immutable source)
        uses: BMWfan/Home-Assistant-Mail-And-Packages/.github/actions/maintenance-monitor@b6a81bf569834956e26db7d6cdc792fc063088e2
        with:
          config: .github/maintenance-monitor.yml
          token: ${{ github.token }}
