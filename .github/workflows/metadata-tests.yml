name: Metadata backend tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test with Home Assistant dependencies
        run: >-
          docker run --rm --network none --entrypoint python
          -v "$GITHUB_WORKSPACE:/work:ro" -w /work
          ghcr.io/home-assistant/home-assistant@sha256:23f4dfbb69ce76315dbc4de7915504f1c2dcecd7ca2648113a493a385972e133
          -m unittest discover -s tests -v
