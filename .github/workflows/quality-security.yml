name: Quality and security
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install pinned Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - name: Scan tracked checkout (redacted, no history or production access)
        run: gitleaks dir . --redact=100 --no-banner --exit-code 1
      - name: Verify narrow secret-scan exception
        run: python3 scripts/test-secret-scan.py
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Parse all tracked Python without modifying sources
        run: python scripts/check-python.py
      - name: Install pinned dependency auditor
        run: python -m pip install pip-audit==2.10.1
      - name: Audit integration manifest requirements (resolver-selected versions)
        run: |
          python -c 'import json,pathlib; pathlib.Path("/tmp/mediarr-audit.txt").write_text("\n".join(json.load(open("custom_components/mediarr/manifest.json"))["requirements"])+"\n")'
          pip-audit -r /tmp/mediarr-audit.txt
