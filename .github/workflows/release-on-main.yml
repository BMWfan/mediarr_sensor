name: Owner-approved release

on:
  workflow_dispatch:
    inputs:
      release_kind:
        description: Explicitly approved release type
        type: choice
        options: [prerelease, stable]
        default: prerelease
        required: true
      version_confirmation:
        description: Type the exact approved package/manifest version
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: release-on-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from manifest
        id: version
        env:
          RELEASE_KIND: ${{ inputs.release_kind }}
          VERSION_CONFIRMATION: ${{ inputs.version_confirmation }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          manifest_path = pathlib.Path("custom_components/mediarr/manifest.json")
          data = json.loads(manifest_path.read_text(encoding="utf-8"))
          version = str(data.get("version", "")).strip()

          if not re.fullmatch(r"\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?", version):
              print(f"Invalid manifest version: {version!r}", file=sys.stderr)
              sys.exit(1)

          kind = os.environ.get("RELEASE_KIND", "")
          if os.environ.get("VERSION_CONFIRMATION") != version:
              sys.exit("Exact owner-approved version confirmation is required.")
          if kind == "prerelease":
              if "-" not in version:
                  sys.exit("Developer prereleases require a prerelease version suffix.")
          elif kind == "stable":
              if not re.fullmatch(r"\d+\.\d+\.\d+", version):
                  sys.exit("A developer version must never be published as stable.")
              if os.environ.get("RELEASE_REF") != "refs/heads/main":
                  sys.exit("Stable releases require the reviewed main branch.")
          else:
              sys.exit("Choose an explicitly approved release type.")

          tag = f"v{version}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
              out.write(f"tag={tag}\n")
          print(f"Resolved release version: {version} ({tag})")
          PY

      - name: Check if tag already exists
        id: tag_check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists. Skipping release creation."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} does not exist yet. Creating release."
          fi

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ inputs.release_kind != 'stable' }}
          make_latest: ${{ inputs.release_kind == 'stable' && 'true' || 'false' }}
