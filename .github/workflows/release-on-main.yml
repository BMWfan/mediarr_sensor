name: Release On Main

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: Explicitly approve publishing the current manifest version
        required: true
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: write

concurrency:
  group: release-on-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.actor == vars.RELEASE_APPROVER && inputs.confirm_release == 'yes'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve and validate release version
        id: version
        run: |
          python3 <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          manifest_path = pathlib.Path("custom_components/mediarr/manifest.json")
          data = json.loads(manifest_path.read_text(encoding="utf-8"))
          version = str(data.get("version", "")).strip()

          if not re.fullmatch(r"\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?", version):
              print(f"Invalid manifest version: {version!r}", file=sys.stderr)
              sys.exit(1)

          tag = f"v{version}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
              out.write(f"tag={tag}\n")
          print(f"Resolved release version: {version} ({tag})")
          PY

      - name: Check if tag already exists
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists. Refusing to publish it again." >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "Could not verify whether tag ${TAG} exists." >&2
              exit "$status"
            fi
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          args=(--target "$GITHUB_SHA" --title "$TAG" --generate-notes)
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"
