- id: plexapi
  kind: release
  repository: pkkid/python-plexapi
  relevance: Plex library, watched state and playback API changes
- id: aiohttp-advisories
  kind: advisory
  ecosystem: pip
  package: aiohttp
  relevance: Review HA-resolved aiohttp versions and provider HTTP transport
- id: plexapi-advisories
  kind: advisory
  ecosystem: pip
  package: plexapi
  relevance: Review Plex dependency exposure; empty result is not a complete audit
